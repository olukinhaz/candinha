      --accent-green-dark: #387552;

      font-family: 'Nunito', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    /* Superfícies e Botões Táteis 3D (Inspiração Duolingo + Identidade Candi) */
    .candi-card {
      background-color: var(--bg-card);
      border: 2px solid var(--border-color);
      border-bottom-width: 4px;
    }

    .candi-elevated {
      background-color: var(--bg-elevated);
      border: 1.5px solid var(--border-color);
    }

    .btn-primary-3d {
      background-color: var(--accent-green);
      color: #FAF7F2;
      border-bottom: 4px solid var(--accent-green-dark);
      font-weight: 800;
      transition: transform 0.1s ease, border-bottom-width 0.1s ease, filter 0.15s ease;
    }
    html.dark .btn-primary-3d {
      color: #140E0B;
    }
    .btn-primary-3d:active {
      border-bottom-width: 0px;
      transform: translateY(3px);
    }

    .btn-wine-3d {
      background-color: var(--accent-wine);
      color: #FAF7F2;
      border-bottom: 4px solid var(--accent-wine-dark);
      font-weight: 800;
      transition: transform 0.1s ease, border-bottom-width 0.1s ease, filter 0.15s ease;
    }
    html.dark .btn-wine-3d {
      color: #140E0B;
    }
    .btn-wine-3d:active {
      border-bottom-width: 0px;
      transform: translateY(3px);
    }

    .btn-vlibras-3d {
      background-color: var(--vlibras-blue);
      color: #FFFFFF;
      border-bottom: 4px solid var(--vlibras-blue-dark);
      font-weight: 800;
      transition: transform 0.1s ease, border-bottom-width 0.1s ease;
    }
    .btn-vlibras-3d:active {
      border-bottom-width: 0px;
      transform: translateY(3px);
    }

    /* Palavras Clicáveis VLibras */
    .vlibras-word {
      display: inline-block;
      border-radius: 0.5rem;
      padding: 0 0.2rem;
      margin: 0 -0.1rem;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 4px;
      transition: all 0.15s ease;
    }
    .vlibras-word:hover {
      background-color: rgba(19, 81, 180, 0.16);
      color: #1351B4;
      transform: translateY(-1px);
    }
    html.dark .vlibras-word:hover {
      background-color: rgba(96, 165, 250, 0.22);
      color: #93C5FD;
    }
    .vlibras-word-active {
      background-color: #1351B4 !important;
      color: #FFFFFF !important;
      font-weight: 800;
      text-decoration: none;
      transform: scale(1.04);
    }

    /* Barra de rolagem fina */

      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(120, 105, 95, 0.35);
      border-radius: 9999px;

    // =========================================================================
    // 2. CAMADA DE PERSISTÊNCIA HÍBRIDA (INDEXEDDB NATIVO + FIREBASE OPCIONAL)
    //    Garante funcionamento 100% fora da sandbox sem usar localStorage!
    // =========================================================================
    const DB_NAME = 'AppCandiLibrasDB_v1';
    const STORE_NAME = 'candi_store';

    function openIndexedDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        const req = window.indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const idb = e.target.result;
          if (!idb.objectStoreNames.contains(STORE_NAME)) {
            idb.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    async function idbGet(key) {
      const idb = await openIndexedDB();
      if (!idb) return null;
      return new Promise((resolve) => {
        const tx = idb.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result ?? null);
        req.onerror = () => resolve(null);
      });
    }

    async function idbSet(key, val) {
      const idb = await openIndexedDB();
      if (!idb) return;
      return new Promise((resolve) => {
        const tx = idb.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(val, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    }

    // =========================================================================
    // 3. TEXTO INTERATIVO — QUALQUER PALAVRA CLICADA ACIONA O VLIBRAS OFICIAL
    // =========================================================================
    function makeClickableWordsHTML(text, activeWord = '') {
      if (!text) return '';
      const tokens = String(text).split(/(\s+)/);
      return tokens
        .map((token) => {
          if (/^\s+$/.test(token)) return token;
          const clean = token.replace(/[.,!?;:()•"]/g, '').trim();
          if (!clean) return token;
          const isHighlighted = activeWord && activeWord.toLowerCase() === clean.toLowerCase();
          const escaped = clean.replace(/'/g, "\\'");
          return `<span role="button" tabindex="0" onclick="event.stopPropagation(); app.triggerVLibras('${escaped}')" class="vlibras-word ${isHighlighted ? 'vlibras-word-active' : ''}" title="Clique para ver o sinal de '${clean}' no VLibras">${token}</span>`;
        })
        .join('');
    }

      async init() {
        // Carrega dados persistidos no IndexedDB do navegador (funciona offline e fora da sandbox)
        const savedModules = await idbGet('candi_modules');
        const savedLessons = await idbGet('candi_lessons');
        const savedSigns = await idbGet('candi_signs');
        const savedChallenges = await idbGet('candi_challenges');
        const savedProgress = await idbGet('candi_progress');
        const savedTheme = await idbGet('candi_theme');

        if (Array.isArray(savedModules) && savedModules.length) this.state.modules = savedModules;
        if (Array.isArray(savedLessons) && savedLessons.length) this.state.lessons = savedLessons;
        if (Array.isArray(savedSigns) && savedSigns.length) this.state.signs = savedSigns;
        if (Array.isArray(savedChallenges) && savedChallenges.length) this.state.challenges = savedChallenges;
        if (savedProgress) {
          this.state.practicedIds = savedProgress.practicedIds || ['sig-1'];
          this.state.completedChallengeIds = savedProgress.completedChallengeIds || [];
          this.state.exerciseAnswers = savedProgress.exerciseAnswers || {};

        }

      },

      async persistAll() {
        await idbSet('candi_modules', this.state.modules);
        await idbSet('candi_lessons', this.state.lessons);
        await idbSet('candi_signs', this.state.signs);
        await idbSet('candi_challenges', this.state.challenges);
        await idbSet('candi_progress', {

        textEl.textContent = msg;

        this._toastTimer = setTimeout(() => {
          container.classList.add('hidden');

      // Aciona exclusivamente o Widget Oficial do VLibras (Gov.br)
      triggerVLibras(rawPhrase) {
        const cleanText = String(rawPhrase || '')
          .replace(/[•()?!.,:;"]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        if (!cleanText) return;

        this.state.vlibrasActivePhrase = cleanText;
        this.notify(`Enviado para o VLibras Oficial: "${cleanText}"`);
        this.renderAll();

        try {
          const accessBtn = document.querySelector('[vw-access-button]');
          const wrapper = document.querySelector('[vw-plugin-wrapper]');
          const isWrapperOpen =
            wrapper &&
            wrapper.classList.contains('active') &&
            window.getComputedStyle(wrapper).display !== 'none';

          if (accessBtn && !isWrapperOpen && accessBtn.classList.contains('active')) {
            accessBtn.click();
          }

          let attempts = 15;
          const tryTranslate = () => {
            if (window.plugin && window.plugin.player && typeof window.plugin.player.translate === 'function') {
              try {
                window.plugin.player.translate(cleanText);
                return;
              } catch (e) {}
            }
            if (attempts > 0) {
              attempts--;
              setTimeout(tryTranslate, 450);
            }
          };
          tryTranslate();
        } catch (err) {
          console.warn('Erro ao enviar para o VLibras:', err);
        }
      },

      togglePracticedSign(signId) {
        const idx = this.state.practicedIds.indexOf(signId);
        if (idx >= 0) {
          this.state.practicedIds.splice(idx, 1);
        } else {
          this.state.practicedIds.push(signId);
        }
        this.persistAll();
        this.notify('Progresso de sinal atualizado!');
        this.renderAll();

      toggleCompletedChallenge(chalId) {
        const idx = this.state.completedChallengeIds.indexOf(chalId);
        if (idx >= 0) {
          this.state.completedChallengeIds.splice(idx, 1);
        } else {
          this.state.completedChallengeIds.push(chalId);
        }
        this.persistAll();
        this.notify('Status do desafio salvo!');
        this.renderAll();
      },

      answerExercise(answerKey, optionIdx) {
        this.state.exerciseAnswers[answerKey] = optionIdx;
        this.persistAll();
        this.renderAll();
      },

      toggleSignParam(signId, paramKey) {
        if (this.state.openParamCard[signId] === paramKey) {
          delete this.state.openParamCard[signId];
        } else {
          this.state.openParamCard[signId] = paramKey;
        }
        this.renderAll();
      },

      // =======================================================================
      // CÂMERA / ESPELHO DE PRÁTICA VISUAL
      // =======================================================================
      stopCameraStream() {
        if (activeMediaStream) {
          activeMediaStream.getTracks().forEach((t) => t.stop());
          activeMediaStream = null;
        }
        activeMediaRecorder = null;
      },

      async startCameraInElement(videoElementId, statusElementId) {
        this.stopCameraStream();
        const videoEl = document.getElementById(videoElementId);
        const statusEl = document.getElementById(statusElementId);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false
          });
          activeMediaStream = stream;
          if (videoEl) {
            videoEl.srcObject = stream;
            videoEl.classList.remove('hidden');
          }
          if (statusEl) statusEl.textContent = 'Câmera ativa (Espelho)';
        } catch (err) {
          if (statusEl) {
            statusEl.textContent = 'Permita o acesso à câmera no navegador para usar o espelho.';
          }
        }
      },

      startRecordingCamera(playbackVideoId, onSavedCallback) {
        if (!activeMediaStream || typeof MediaRecorder === 'undefined') {
          this.notify('Abra a câmera primeiro para gravar.');
          return;
        }
        recordedChunks = [];
        activeMediaRecorder = new MediaRecorder(activeMediaStream);
        activeMediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };
        activeMediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64Video = reader.result;
            const playbackEl = document.getElementById(playbackVideoId);
            if (playbackEl) {
              playbackEl.src = base64Video;
              playbackEl.classList.remove('hidden');
            }
            if (onSavedCallback) onSavedCallback(base64Video);
            this.notify('Gravação pronta para revisão!');
          };
          reader.readAsDataURL(blob);
        };
        activeMediaRecorder.start();
        this.notify('Gravando sinalização...');
      },

      stopRecordingCamera() {
        if (activeMediaRecorder && activeMediaRecorder.state !== 'inactive') {
          activeMediaRecorder.stop();
        }
      },

        modal.innerHTML = `

      exportDatabaseJSON() {
        const data = {
          modules: this.state.modules,
          lessons: this.state.lessons,
          signs: this.state.signs,
          challenges: this.state.challenges
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'candi-libras-backup.json';
        a.click();
        URL.revokeObjectURL(url);
        this.notify('Backup exportado com sucesso!');
      },

      importDatabaseJSON(event) {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (Array.isArray(parsed.modules)) this.state.modules = parsed.modules;
            if (Array.isArray(parsed.lessons)) this.state.lessons = parsed.lessons;
            if (Array.isArray(parsed.signs)) this.state.signs = parsed.signs;
            if (Array.isArray(parsed.challenges)) this.state.challenges = parsed.challenges;
            await this.persistAll();
            this.renderAll();
            this.notify('Dados importados com sucesso!');
          } catch (err) {
            this.notify('Arquivo JSON inválido.');
          }
        };
        reader.readAsText(file);
      },

          case 'video':
            return `
              <div class="p-4 rounded-2xl candi-card space-y-3">
                <div class="flex items-center justify-between">
                  <span class="font-extrabold text-sm flex items-center gap-2">

                    ${block.title || 'Demonstração'}
                  </span>
                  <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full candi-elevated">${block.signReference || 'Sinal'}</span>
                </div>
                ${this.renderSignCardHTML({
                  id: block.id || `vid-${index}`,
                  name: block.signReference || block.title || 'OLÁ',
                  vlibrasGlosa: block.signReference || 'OLÁ',
                  handshape: 'Demonstração da aula',
                  location: 'Espaço visual',
                  expression: block.caption || 'Olhar atento',
                  candiExplanation: block.caption || 'Clique em qualquer palavra para sinalizar.'
                })}
              </div>
            `;
          case 'exercicio': {
            const key = `${lessonId}-${block.id || index}`;
            const chosen = this.state.exerciseAnswers[key];
            const isCorrect = chosen === Number(block.correctIndex);
            return `
              <div class="p-4 rounded-2xl candi-elevated space-y-3">
                <div class="flex items-center gap-2 text-xs sm:text-sm font-extrabold">
                  <i data-lucide="check-circle-2" class="w-4 h-4" style="color: var(--accent-green);"></i>
                  <span>${makeClickableWordsHTML(block.question, activeWord)}</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  ${(block.options || [])
                    .slice(0, 3)
                    .map((opt, oIdx) => {
                      const selected = chosen === oIdx;
                      const right = Number(block.correctIndex) === oIdx;
                      const bgClass = selected
                        ? right
                          ? 'bg-emerald-600 text-white border-emerald-800'
                          : 'bg-rose-600 text-white border-rose-800'
                        : 'candi-card';
                      return `
                        <button type="button" onclick="app.answerExercise('${key}', ${oIdx})" class="p-3 rounded-xl text-xs font-extrabold text-left flex items-center justify-between ${bgClass}">
                          <span>${opt}</span>
                          ${selected ? `<span>${right ? '✓' : '×'}</span>` : ''}
                        </button>
                      `;
                    })
                    .join('')}
                </div>
                ${
                  chosen !== undefined && block.explanation
                    ? `<p class="text-xs font-extrabold ${isCorrect ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600'}">${block.explanation}</p>`
                    : ''
                }
              </div>
            `;
          }
          default:
            return '';
        }
      },

      renderSignsStudioHTML() {
        const categories = ['Todas', ...new Set(this.state.signs.map((s) => s.category).filter(Boolean))];

          const q = this.state.signSearch.trim().toLowerCase();
          const matchQ = !q || s.name.toLowerCase().includes(q) || s.category.toLowerCase().includes(q);
          const matchCat = this.state.signCategoryFilter === 'Todas' || s.category === this.state.signCategoryFilter;
          const matchMod = this.state.signModuleFilter === 'Todos' || s.moduleId === this.state.signModuleFilter;

                  <button type="button" onclick="app.state.studyMode='treino'; app.state.studyIndex=0; app.renderAll();" class="px-3.5 py-2 rounded-xl text-xs font-extrabold ${
                    this.state.studyMode === 'treino' ? 'btn-wine-3d' : 'candi-elevated'

              <div class="flex items-center gap-2 overflow-x-auto pb-1">

                            <button type="button" onclick="app.state.studyIndex = ${idx < filtered.length - 1 ? idx + 1 : 0}; app.renderAll();" class="p-2 rounded-xl btn-primary-3d">Próximo</button>

                  .join('')}
              </div>

              <div class="flex items-center gap-2">
                <button type="button" onclick="app.exportDatabaseJSON()" class="px-3 py-2 rounded-xl candi-elevated text-xs font-extrabold">Exportar Backup</button>
                <label class="px-3 py-2 rounded-xl candi-elevated text-xs font-extrabold cursor-pointer">
                  Importar JSON
                  <input type="file" accept=".json" onchange="app.importDatabaseJSON(event)" class="hidden" />
                </label>
                <button type="button" onclick="app.state.isAdminUnlocked=false; app.navigate('inicio');" class="px-3 py-2 rounded-xl bg-rose-600 text-white text-xs font-extrabold">Sair</button>
              </div>
            </div>

            ${
              sub === 'sinais'
                ? `
              <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                <div class="md:col-span-6 space-y-2">
                  ${this.state.signs
                    .map(
                      (s) => `
                    <div class="p-3 rounded-2xl candi-card flex items-center justify-between">
                      <div>
                        <span class="font-extrabold text-sm block">${s.name}</span>
                        <span class="text-xs opacity-70">${s.category}</span>
                      </div>
                      <button type="button" onclick="app.deleteSign('${s.id}')" class="p-2 rounded-xl bg-rose-600/15 text-rose-500 text-xs font-bold">Excluir</button>
                    </div>
                  `
                    )
                    .join('')}
                </div>
                <form onsubmit="event.preventDefault(); app.createQuickSign();" class="md:col-span-6 p-5 rounded-3xl candi-card space-y-3 text-xs">
                  <h3 class="font-extrabold text-sm">Cadastrar Novo Sinal</h3>
                  <input id="new-sign-name" required placeholder="Nome do Sinal (ex: BOM DIA)" class="w-full px-3 py-2.5 rounded-xl candi-elevated font-bold" />
                  <input id="new-sign-cat" required placeholder="Categoria (ex: Saudações)" class="w-full px-3 py-2.5 rounded-xl candi-elevated font-bold" />
                  <div class="grid grid-cols-3 gap-2">
                    <input id="new-sign-hand" placeholder="Mão" class="px-3 py-2 rounded-xl candi-elevated" />
                    <input id="new-sign-loc" placeholder="Onde (ex: Testa)" class="px-3 py-2 rounded-xl candi-elevated" />
                    <input id="new-sign-exp" placeholder="Rosto" class="px-3 py-2 rounded-xl candi-elevated" />
                  </div>
                  <input id="new-sign-desc" placeholder="Explicação curta da Candi" class="w-full px-3 py-2.5 rounded-xl candi-elevated" />
                  <button type="submit" class="w-full py-2.5 rounded-xl btn-primary-3d">Salvar Sinal</button>
                </form>
              </div>
            `
                : sub === 'modulos'
                ? `
              <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                <div class="md:col-span-6 space-y-2">
                  ${this.state.modules
                    .map(
                      (m) => `
                    <div class="p-3 rounded-2xl candi-card flex items-center justify-between">
                      <span class="font-extrabold text-sm">${m.title} (${m.duration})</span>
                      <button type="button" onclick="app.deleteModule('${m.id}')" class="p-2 rounded-xl bg-rose-600/15 text-rose-500 text-xs font-bold">Excluir</button>
                    </div>
                  `
                    )
                    .join('')}
                </div>
                <form onsubmit="event.preventDefault(); app.createQuickModule();" class="md:col-span-6 p-5 rounded-3xl candi-card space-y-3 text-xs">
                  <h3 class="font-extrabold text-sm">Novo Módulo Personalizado</h3>
                  <input id="new-mod-title" required placeholder="Título do Módulo" class="w-full px-3 py-2.5 rounded-xl candi-elevated font-bold" />
                  <input id="new-mod-dur" required placeholder="Duração (ex: 4 sem)" class="w-full px-3 py-2.5 rounded-xl candi-elevated" />
                  <input id="new-mod-desc" required placeholder="Descrição curta" class="w-full px-3 py-2.5 rounded-xl candi-elevated" />
                  <button type="submit" class="w-full py-2.5 rounded-xl btn-primary-3d">Adicionar Módulo</button>
                </form>
              </div>
            `
                : sub === 'desafios'
                ? `
              <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                <div class="md:col-span-6 space-y-2">
                  ${this.state.challenges
                    .map(
                      (c) => `
                    <div class="p-3 rounded-2xl candi-card flex items-center justify-between">
                      <span class="font-extrabold text-sm">${c.title}</span>
                      <button type="button" onclick="app.deleteChallenge('${c.id}')" class="p-2 rounded-xl bg-rose-600/15 text-rose-500 text-xs font-bold">Excluir</button>
                    </div>
                  `
                    )
                    .join('')}
                </div>
                <form onsubmit="event.preventDefault(); app.createQuickChallenge();" class="md:col-span-6 p-5 rounded-3xl candi-card space-y-3 text-xs">
                  <h3 class="font-extrabold text-sm">Publicar Desafio da Semana</h3>
                  <input id="new-chal-title" required placeholder="Título do Desafio" class="w-full px-3 py-2.5 rounded-xl candi-elevated font-bold" />
                  <input id="new-chal-desc" required placeholder="Objetivo curto" class="w-full px-3 py-2.5 rounded-xl candi-elevated" />
                  <textarea id="new-chal-steps" rows="3" placeholder="3 passos (1 por linha)" class="w-full px-3 py-2 rounded-xl candi-elevated"></textarea>
                  <button type="submit" class="w-full py-2.5 rounded-xl btn-wine-3d">Publicar Desafio</button>
                </form>
              </div>
            `
                : `
              <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                <div class="md:col-span-6 space-y-2">
                  ${this.state.lessons
                    .map(
                      (l) => `
                    <div class="p-3 rounded-2xl candi-card flex items-center justify-between">
                      <div>
                        <span class="font-extrabold text-sm block">${l.title}</span>
                        <span class="text-xs opacity-70">${l.duration}</span>
                      </div>
                      <button type="button" onclick="app.deleteLesson('${l.id}')" class="p-2 rounded-xl bg-rose-600/15 text-rose-500 text-xs font-bold">Excluir</button>
                    </div>
                  `
                    )
                    .join('')}
                </div>
                <form onsubmit="event.preventDefault(); app.createQuickLesson();" class="md:col-span-6 p-5 rounded-3xl candi-card space-y-3 text-xs">
                  <h3 class="font-extrabold text-sm">Criar Nova Aula</h3>
                  <input id="new-les-title" required placeholder="Título da Aula" class="w-full px-3 py-2.5 rounded-xl candi-elevated font-bold" />
                  <select id="new-les-mod" class="w-full px-3 py-2.5 rounded-xl candi-elevated font-bold">
                    ${this.state.modules.map((m) => `<option value="${m.id}">${m.title}</option>`).join('')}
                  </select>
                  <input id="new-les-intro" required placeholder="Resumo da aula" class="w-full px-3 py-2.5 rounded-xl candi-elevated" />
                  <textarea id="new-les-content" rows="3" placeholder="Explicação principal da aula" class="w-full px-3 py-2 rounded-xl candi-elevated"></textarea>
                  <button type="submit" class="w-full py-2.5 rounded-xl btn-primary-3d">Publicar Aula</button>
                </form>
              </div>
            `
            }
          </div>
        `;
      },

      createQuickSign() {
        const name = document.getElementById('new-sign-name').value.trim().toUpperCase();
        const category = document.getElementById('new-sign-cat').value.trim();
        const handshape = document.getElementById('new-sign-hand').value.trim() || 'Natural';
        const location = document.getElementById('new-sign-loc').value.trim() || 'Neutro';
        const expression = document.getElementById('new-sign-exp').value.trim() || 'Atenta';
        const candiExplanation = document.getElementById('new-sign-desc').value.trim();
        if (!name) return;

        this.state.signs.push({
          id: 'sig-' + Date.now(),
          name,
          vlibrasGlosa: name,
          category,
          moduleId: 'mod-1',
          handshape,
          location,
          expression,
          candiExplanation
        });
        this.persistAll();
        this.notify('Sinal adicionado!');
        this.renderAll();
      },

      deleteSign(id) {
        this.state.signs = this.state.signs.filter((s) => s.id !== id);
        this.persistAll();
        this.renderAll();
      },

      createQuickModule() {
        const title = document.getElementById('new-mod-title').value.trim();
        const duration = document.getElementById('new-mod-dur').value.trim();
        const description = document.getElementById('new-mod-desc').value.trim();
        if (!title) return;
        this.state.modules.push({
          id: 'mod-' + Date.now(),
          order: this.state.modules.length + 1,
          title,
          duration,
          active: true,
          categoryTag: 'Personalizado',
          description,
          topics: ['Prática visual', 'Sinais do módulo', 'Revisão']
        });
        this.persistAll();
        this.notify('Módulo salvo!');
        this.renderAll();
      },

      deleteModule(id) {
        this.state.modules = this.state.modules.filter((m) => m.id !== id);
        this.persistAll();
        this.renderAll();
      },

      createQuickChallenge() {
        const title = document.getElementById('new-chal-title').value.trim();
        const description = document.getElementById('new-chal-desc').value.trim();
        const guidelines = document.getElementById('new-chal-steps').value.trim();
        if (!title) return;
        this.state.challenges.unshift({
          id: 'chal-' + Date.now(),
          title,
          description,
          guidelines: guidelines || '1. Praticar sinal\n2. Gravar no espelho',
          deadline: 'Próxima aula',
          activityType: 'Prática',
          status: 'published',
          attachments: [title.toUpperCase()]
        });
        this.persistAll();
        this.notify('Desafio publicado!');
        this.renderAll();
      },

      deleteChallenge(id) {
        this.state.challenges = this.state.challenges.filter((c) => c.id !== id);
        this.persistAll();
        this.renderAll();
      },

      createQuickLesson() {
        const title = document.getElementById('new-les-title').value.trim();
        const moduleId = document.getElementById('new-les-mod').value;
        const intro = document.getElementById('new-les-intro').value.trim();
        const content = document.getElementById('new-les-content').value.trim();
        if (!title) return;
        this.state.lessons.push({
          id: 'les-' + Date.now(),
          moduleId,
          order: this.state.lessons.length + 1,
          title,
          status: 'published',
          duration: '45m',
          intro,
          blocks: [
            { id: 'b-' + Date.now(), type: 'titulo', content: title },
            { id: 'b2-' + Date.now(), type: 'destaque', title: 'Explicação da Candi', content: content || intro }
          ]
        });
        this.persistAll();
        this.notify('Aula publicada!');
        this.renderAll();
      },

      deleteLesson(id) {
        this.state.lessons = this.state.lessons.filter((l) => l.id !== id);
        this.persistAll();
        this.renderAll();
      },

      // =======================================================================
      // CICLO DE RENDERIZAÇÃO PRINCIPAL
      // =======================================================================
      renderAll() {
        // Atualiza cabeçalho
        const vlibrasLabel = document.getElementById('header-vlibras-label');
        if (vlibrasLabel) vlibrasLabel.textContent = `VLibras: ${this.state.vlibrasActivePhrase.slice(0, 12)}`;

        const progressCount = document.getElementById('header-progress-count');
        if (progressCount) progressCount.textContent = `${this.state.practicedIds.length}/${this.state.signs.length}`;

        const themeIcon = document.getElementById('theme-icon');
        if (themeIcon) themeIcon.setAttribute('data-lucide', this.state.theme === 'light' ? 'moon' : 'sun');

        const adminIcon = document.getElementById('admin-lock-icon');
        if (adminIcon) adminIcon.setAttribute('data-lucide', this.state.isAdminUnlocked ? 'sliders' : 'lock');

        // Renderiza Conteúdo Principal
        const mainEl = document.getElementById('app-main');
        const activeLesson = this.state.lessons.find((l) => l.id === this.state.activeLessonId);

        if (activeLesson) {
          mainEl.innerHTML = `
            <div class="space-y-5">
              <button type="button" onclick="app.state.activeLessonId=null; app.renderAll();" class="px-4 py-2 rounded-xl candi-card text-xs font-extrabold inline-flex items-center gap-1.5">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                <span>Voltar</span>
              </button>
              <article class="rounded-3xl candi-card p-6 space-y-6">
                <div class="border-b border-current/10 pb-4">
                  <span class="text-xs font-extrabold opacity-70">${activeLesson.duration}</span>
                  <h1 class="text-2xl font-black mt-0.5">${makeClickableWordsHTML(activeLesson.title, this.state.vlibrasActivePhrase)}</h1>
                </div>
                <div class="space-y-5">
                  ${(activeLesson.blocks || []).map((b, i) => this.renderLessonBlockHTML(b, i, activeLesson.id)).join('')}
                </div>
              </article>
            </div>
          `;
        } else if (this.state.activeTab === 'inicio') {
          mainEl.innerHTML = this.renderHomeHTML();
        } else if (this.state.activeTab === 'modulos') {
          mainEl.innerHTML = this.renderModulesHTML();
        } else if (this.state.activeTab === 'biblioteca') {
          mainEl.innerHTML = this.renderSignsStudioHTML();
        } else if (this.state.activeTab === 'desafios') {
          mainEl.innerHTML = this.renderChallengesHTML();
        } else if (this.state.activeTab === 'admin' && this.state.isAdminUnlocked) {
          mainEl.innerHTML = this.renderAdminHTML();
        }

        // Renderiza Dock Inferior de Ícones
        const dockEl = document.getElementById('bottom-dock');
        const navItems = [
          { id: 'inicio', label: 'Início', icon: 'compass' },
          { id: 'modulos', label: 'Módulos', icon: 'book-open' },
          { id: 'biblioteca', label: 'Estúdio Sinais', icon: 'hand' },
          { id: 'desafios', label: 'Desafios', icon: 'award' }
        ];
        if (this.state.isAdminUnlocked) {
          navItems.push({ id: 'admin', label: 'Admin', icon: 'sliders' });
        }

        dockEl.innerHTML = navItems
          .map((item) => {
            const isCur = this.state.activeTab === item.id && !this.state.activeLessonId;
            const activeClass = isCur ? (item.id === 'desafios' || item.id === 'admin' ? 'btn-wine-3d' : 'btn-primary-3d') : 'hover:bg-current/5';
            return `
              <button type="button" onclick="app.navigate('${item.id}')" class="px-4 py-2.5 rounded-xl flex flex-col sm:flex-row items-center gap-1 sm:gap-2 transition ${activeClass}">
                <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                <span class="text-[10px] sm:text-xs font-extrabold">${item.label}</span>
              </button>
            `;
          })
          .join('');

        lucide.createIcons();
      }
    };

    window.app = app;
    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
